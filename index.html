<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Online Cricket Game</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#071b12,#0b5d35);
  color:white;
  min-height:100vh;
  padding:18px;
}
.container{
  max-width:500px;
  margin:auto;
}
.card{
  background:rgba(255,255,255,.10);
  backdrop-filter:blur(12px);
  border-radius:24px;
  padding:22px;
  margin-top:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
h1{
  text-align:center;
  margin:5px 0 20px;
  font-size:30px;
}
h2{
  margin-top:5px;
}
input{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  margin:7px 0;
  font-size:17px;
}
button{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:0;
  border-radius:13px;
  background:#19c463;
  color:white;
  font-size:18px;
  font-weight:bold;
}
button:active{
  transform:scale(.97);
}
.shots{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.shots button{
  margin:0;
  font-size:20px;
}
.score{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.player{
  background:rgba(0,0,0,.25);
  padding:15px;
  border-radius:16px;
  text-align:center;
}
.big{
  font-size:28px;
  font-weight:bold;
}
#status{
  text-align:center;
  font-size:18px;
  min-height:28px;
  margin:15px 0;
}
#roomInfo{
  text-align:center;
  font-size:18px;
  background:#063d24;
  padding:12px;
  border-radius:12px;
}
.hidden{
  display:none;
}
.small{
  font-size:14px;
  opacity:.8;
  text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h1>🏏 Online Cricket</h1>

<div id="menu">

<input id="playerName" placeholder="Enter your name">

<button onclick="createRoom()">🟢 Create Room</button>

<input id="roomCode" placeholder="Enter Room Code">

<button onclick="joinRoom()">🔵 Join Room</button>

<p class="small">
Create a room on one phone and enter the same code on the second phone.
</p>

</div>

<div id="game" class="hidden">

<div id="roomInfo"></div>

<div class="score">

<div class="player">
<div id="p1Name">Player 1</div>
<div class="big" id="p1Score">0/0</div>
<div id="p1Balls">Balls: 0</div>
</div>

<div class="player">
<div id="p2Name">Player 2</div>
<div class="big" id="p2Score">0/0</div>
<div id="p2Balls">Balls: 0</div>
</div>

</div>

<div id="status">Waiting...</div>

<div class="shots">
<button onclick="playShot(1)">1️⃣ Run</button>
<button onclick="playShot(2)">2️⃣ Runs</button>
<button onclick="playShot(4)">4️⃣ Runs</button>
<button onclick="playShot(6)">6️⃣ Runs</button>
</div>

<button onclick="newGame()">🔄 New Game</button>
<button onclick="leaveRoom()">🚪 Leave Room</button>

</div>

</div>
</div>

<script>

// Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyA5FgT1mCSwIdXaZqE5SUgFue671oksB18",
  authDomain: "online-cricket-game-16a50.firebaseapp.com",
  projectId: "online-cricket-game-16a50",
  storageBucket: "online-cricket-game-16a50.firebasestorage.app",
  messagingSenderId: "959065126241",
  appId: "1:959065126241:web:fefe74e579e0a8d720120",
  measurementId: "G-XSSMBQ8FPM",
  databaseURL: "https://online-cricket-game-16a50-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let roomId = "";
let myPlayer = "";
let myName = "";
let roomRef = null;


// Generate room code
function generateRoomCode(){
  return Math.random().toString(36).substring(2,8).toUpperCase();
}


// CREATE ROOM
function createRoom(){

  myName = document.getElementById("playerName").value.trim();

  if(!myName){
    alert("Please enter your name");
    return;
  }

  roomId = generateRoomCode();
  myPlayer = "p1";

  roomRef = db.ref("rooms/" + roomId);

  const game = {
    p1:{
      name:myName,
      score:0,
      wickets:0,
      balls:0
    },

    p2:{
      name:"",
      score:0,
      wickets:0,
      balls:0
    },

    turn:"p1",
    status:"waiting",
    winner:"",
    created:Date.now()
  };

  roomRef.set(game).then(()=>{

    showGame();

    document.getElementById("roomInfo").innerText =
      "ROOM CODE: " + roomId;

    listenGame();

    document.getElementById("status").innerText =
      "Waiting for Player 2...";

  });

}


// JOIN ROOM
function joinRoom(){

  myName = document.getElementById("playerName").value.trim();
  roomId = document.getElementById("roomCode").value.trim().toUpperCase();

  if(!myName){
    alert("Please enter your name");
    return;
  }

  if(!roomId){
    alert("Enter room code");
    return;
  }

  roomRef = db.ref("rooms/" + roomId);

  roomRef.once("value").then(snapshot=>{

    if(!snapshot.exists()){
      alert("Room not found!");
      return;
    }

    const data = snapshot.val();

    if(data.p2 && data.p2.name){
      alert("Room already has 2 players!");
      return;
    }

    myPlayer = "p2";

    roomRef.child("p2").update({
      name:myName
    });

    roomRef.child("status").set("playing");

    showGame();

    document.getElementById("roomInfo").innerText =
      "ROOM CODE: " + roomId;

    listenGame();

  });

}


// SHOW GAME
function showGame(){

  document.getElementById("menu").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

}


// LISTEN FOR REALTIME CHANGES
function listenGame(){

  roomRef.on("value", snapshot=>{

    if(!snapshot.exists()) return;

    const data = snapshot.val();

    updateScreen(data);

  });

}


// UPDATE SCREEN
function updateScreen(data){

  document.getElementById("p1Name").innerText =
    data.p1.name || "Player 1";

  document.getElementById("p2Name").innerText =
    data.p2.name || "Waiting...";

  document.getElementById("p1Score").innerText =
    data.p1.score + "/" + data.p1.wickets;

  document.getElementById("p2Score").innerText =
    data.p2.score + "/" + data.p2.wickets;

  document.getElementById("p1Balls").innerText =
    "Balls: " + data.p1.balls;

  document.getElementById("p2Balls").innerText =
    "Balls: " + data.p2.balls;


  if(data.status === "waiting"){

    document.getElementById("status").innerText =
      "⏳ Waiting for Player 2...";

    disableShots(true);

    return;
  }


  if(data.status === "finished"){

    disableShots(true);

    document.getElementById("status").innerText =
      "🏆 " + data.winner + " WINS!";

    return;
  }


  if(data.turn === myPlayer){

    document.getElementById("status").innerText =
      "🏏 Your turn! Choose your shot.";

    disableShots(false);

  }else{

    document.getElementById("status").innerText =
      "⏳ Waiting for " +
      (data.turn === "p1" ? data.p1.name : data.p2.name);

    disableShots(true);

  }

}


// ENABLE / DISABLE SHOTS
function disableShots(disabled){

  document.querySelectorAll(".shots button").forEach(btn=>{
    btn.disabled = disabled;
    btn.style.opacity = disabled ? ".5" : "1";
  });

}


// PLAY SHOT
function playShot(runs){

  if(!roomRef || !myPlayer) return;

  roomRef.once("value").then(snapshot=>{

    const data = snapshot.val();

    if(!data) return;

    if(data.status !== "playing") return;

    if(data.turn !== myPlayer){
      alert("Wait for your turn!");
      return;
    }

    const current = data[myPlayer];

    let newScore = current.score;
    let newWickets = current.wickets;
    let newBalls = current.balls + 1;

    // Random chance of OUT
    const random = Math.floor(Math.random()*7);

    if(random === 0){

      newWickets++;

    }else{

      newScore += runs;

    }


    const updates = {};

    updates[myPlayer + "/score"] = newScore;
    updates[myPlayer + "/wickets"] = newWickets;
    updates[myPlayer + "/balls"] = newBalls;


    // Innings ends after 12 balls or 3 wickets
    const inningsOver =
      newBalls >= 12 || newWickets >= 3;


    if(inningsOver){

      if(myPlayer === "p1"){

        updates.turn = "p2";

      }else{

        updates.status = "finished";

        const p1Score = data.p1.score;
        const p2Score = newScore;

        if(p2Score > p1Score){

          updates.winner = data.p2.name;

        }else if(p1Score > p2Score){

          updates.winner = data.p1.name;

        }else{

          updates.winner = "DRAW 🤝";

        }

      }

    }else{

      // Continue same player's innings
      updates.turn = myPlayer;

    }


    roomRef.update(updates);

  });

}


// NEW GAME
function newGame(){

  if(!roomRef) return;

  roomRef.set({

    p1:{
      name:"",
      score:0,
      wickets:0,
      balls:0
    },

    p2:{
      name:"",
      score:0,
      wickets:0,
      balls:0
    },

    turn:"p1",
    status:"waiting",
    winner:"",
    created:Date.now()

  }).then(()=>{

    roomRef.child(myPlayer).update({
      name:myName
    });

    if(myPlayer === "p1"){

      document.getElementById("status").innerText =
        "Waiting for Player 2...";

    }

  });

}


// LEAVE ROOM
function leaveRoom(){

  if(roomRef){

    roomRef.off();

  }

  location.reload();

}

</script>

</body>
  </html>
